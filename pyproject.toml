[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petmind"
version = "0.1.0"
description = "PetMind - Registro de comportamentos e rotinas de pets com IA"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic[email]>=2.0.0",
    "sqlalchemy>=2.0.0",
    "bcrypt>=4.0.0",
    "python-dotenv>=1.0.0",
    "PyJWT>=2.9.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
ia = [
    "groq>=0.4.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "alembic>=1.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
